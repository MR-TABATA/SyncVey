[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syncvey"
dynamic = ["version"]
description = "Self-hosted AWS inventory and tfstate drift detection ledger"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Hitoshi Tabata" },
]
classifiers = [
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "Django>=5.0",
    "dj-database-url>=2.0",
    "psycopg[binary]>=3.1",
    "django-debug-toolbar>=4.0",
    "diagrams>=0.23",
    "pyotp>=2.8",
    "qrcode[pil]>=7.4",
    "boto3>=1.28",
    "django-apscheduler>=0.6",
    "cryptography>=42.0.0",
]

[project.scripts]
syncvey = "syncvey.cli:main"

[tool.hatch.version]
path = "syncvey/__init__.py"

[tool.hatch.build.targets.wheel.sources]
"syncvey" = "syncvey"
"config" = "syncvey/config"
"asset_manager" = "syncvey/asset_manager"
"syncvey_drift_risk" = "syncvey/syncvey_drift_risk"
"syncvey_blast_radius" = "syncvey/syncvey_blast_radius"
"syncvey_cli" = "syncvey/syncvey_cli"
"templates" = "syncvey/templates"
"locale" = "syncvey/locale"
"static" = "syncvey/static"
"fixtures" = "syncvey/fixtures"

[tool.hatch.build.targets.wheel]
only-include = [
    "syncvey",
    "config",
    "asset_manager",
    "syncvey_drift_risk",
    "syncvey_blast_radius",
    "syncvey_cli",
    "templates",
    "locale",
    "static",
    "fixtures",
]

[tool.hatch.build.targets.sdist]
include = [
    "syncvey",
    "config",
    "asset_manager",
    "syncvey_drift_risk",
    "syncvey_blast_radius",
    "syncvey_cli",
    "templates",
    "locale",
    "static",
    "fixtures",
    "manage.py",
    "README.md",
    "LICENSE",
]
