name: Bug report
description: Something does not work as described (wrong drift, a missing asset, a crash, a wrong EOL verdict…)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste real AWS account IDs, credentials, role ARNs or tfstate contents** — replace them with placeholders.
        For a security problem, do not open an issue: use the private report link on the issue chooser (see `SECURITY.md`).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal case is worth more than a long one.
      placeholder: |
        1. Upload a tfstate with an aws_db_instance …
        2. Open the asset list …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag (`docker image ls`) or the commit you are running.
      placeholder: "v0.6.0"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How you run it
      options:
        - Docker Compose
        - Dev Container
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact account IDs, ARNs and hostnames first.
      render: shell
    validations:
      required: false
