name: i18n

on:
  push:
  pull_request:

jobs:
  catalogue:
    name: No unreviewed translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pure stdlib — no dependencies to install, no database, no settings module.
      - name: Fail on fuzzy or empty translations
        run: python -m asset_manager.i18n_check
