name: history

# 開発の記録ページ（docs/history.{ja,en}.html）は git のコミットから生成する
# （以前は「マージ済み PR」からで、main へ直接積んだコミットが 3 件連続で
# 抜けたまま気づかなかった実害があった）。
#
# これは「古かったら落とす」ゲートにしていない。ゲートにするとコミットの
# たびに main が赤くなり、赤を消すためだけの手作業が毎回発生する。
# 代わりに main への push で再生成し、変化があった時だけコミットする。
#
# 翻訳が無いコミットがあってもスクリプトは失敗せず、原文のまま両言語に
# 出る。ページが取りこぼすことはなく、訳したくなった時に
# scripts/build_history.py の COMMITS へ追記すればいい。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 直列化する。連続マージで 2 つの実行が同じファイルを push し合うのを防ぐ。
concurrency:
  group: history-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 既定は浅いクローン（1 コミット）。このスクリプトは初コミットの
          # 日付とコミット総数を git 履歴から数えるので、浅いままだと
          # 「開発日数 1・コミット 1」という嘘の統計を生成して公開する。
          # 実際に一度公開してしまった。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the history page
        run: python3 scripts/build_history.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- docs/history.ja.html docs/history.en.html; then
            echo "No change — the page already matches the commit history."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/history.ja.html docs/history.en.html
          # [skip ci] 付きで積む。テストや E2E を回す意味のない差分だし、
          # この push でこのワークフロー自体が再帰的に走るのも避けたい
          # （2 回目は差分ゼロで止まるが、無駄には変わりない）。
          git commit -m "docs: rebuild the development-history page [skip ci]"
          git push
