{% load i18n %}

<!-- Header -->
<div class="flex items-center justify-between gap-3 flex-wrap mb-5">
  <div class="flex items-center gap-2 text-sm">
    <button
      class="text-slate-500 hover:text-slate-800 font-medium transition-colors"
      hx-get="{% url 'sample-list' %}"
      hx-target="#main-content"
      hx-swap="innerHTML"
    >{% trans "Sample Library" %}</button>
    <span class="text-slate-300">/</span>
    <span class="font-semibold text-slate-700">{{ name }}</span>
    <span class="text-xs font-bold px-2 py-0.5 rounded-full {{ env_color }}">{{ env_type }}</span>
  </div>
  <a
    href="{% url 'sample-download' filename %}"
    class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-[#FF6B6B] hover:bg-[#e84040] text-white text-xs font-semibold rounded-lg transition-colors"
  >
    <i data-lucide="download" class="w-3.5 h-3.5"></i>
    {% trans "Download" %}
  </a>
</div>

<!-- Resource summary -->
<div class="flex flex-wrap gap-2 mb-4">
  {% for atype, cnt in summary.items %}
  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs font-semibold text-slate-700">
    {{ atype }} <span class="text-slate-400">× {{ cnt }}</span>
  </span>
  {% endfor %}
</div>

<!-- JSON viewer -->
<div class="bg-slate-900 rounded-xl border border-slate-700 overflow-hidden">
  <div class="flex items-center justify-between px-4 py-2.5 border-b border-slate-700">
    <span class="text-xs font-mono text-slate-400">{{ filename }}</span>
    <button
      onclick="navigator.clipboard.writeText(document.getElementById('json-content').textContent)"
      class="text-xs text-slate-500 hover:text-slate-300 flex items-center gap-1 transition-colors"
    >
      <i data-lucide="copy" class="w-3 h-3"></i>
      {% trans "Copy" %}
    </button>
  </div>
  <pre id="json-content" class="text-xs text-green-300 font-mono p-4 overflow-auto max-h-[65vh] leading-relaxed whitespace-pre">{{ json_content }}</pre>
</div>
