{% load i18n static %}{% get_current_language as CURRENT_LANG %}
<!DOCTYPE html>
<html lang="{{ CURRENT_LANG }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Sign In" %} — SyncVey</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}?v=2">
    <link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.min.js" integrity="sha384-bdZtphetAEBgkGZvhZXOFDWc55tHGLqaSo1f4qZtgvEiolEBqlJ9u6FTk+CoLfj0" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4">

    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center mx-auto mb-5 shadow-lg shadow-indigo-500/40">
                <svg viewBox="0 0 100 100" class="w-8 h-8" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="86" x2="90" y2="86" stroke-width="6"/><line x1="26" y1="16" x2="26" y2="86" stroke-width="7"/><line x1="74" y1="16" x2="74" y2="86" stroke-width="7"/><line x1="10" y1="64" x2="90" y2="64" stroke-width="6"/><path d="M 10 64 L 26 16 Q 50 86 74 16 L 90 64" stroke-width="6"/><line x1="38" y1="64" x2="38" y2="44" stroke-width="3"/><line x1="50" y1="64" x2="50" y2="52" stroke-width="3"/><line x1="62" y1="64" x2="62" y2="44" stroke-width="3"/></svg>
            </div>
            <h1 class="text-white font-serif font-bold text-[32px] tracking-[0.01em]"><span class="text-[#FF6B6B]">Sync</span>Vey</h1>
            <p class="text-indigo-300 text-[9px] uppercase tracking-[0.2em] font-semibold mt-2">Synchronized Survey</p>
            <div class="mt-2 h-0.5 w-12 bg-indigo-500 mx-auto rounded-full"></div>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <h2 class="text-lg font-bold text-slate-800 mb-6">{% trans "Sign In" %}</h2>

            {% if error %}
            <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3 mb-5">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5" for="id_username">
                        {% trans "Username" %}
                    </label>
                    <input
                        id="id_username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        autofocus
                        value="{{ username|default:'' }}"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                        placeholder="username"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5" for="id_password">
                        {% trans "Password" %}
                    </label>
                    <input
                        id="id_password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                        placeholder="••••••••"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full py-2.5 bg-[#FF6B6B] hover:bg-[#e84040] text-white font-semibold text-sm rounded-xl transition-colors"
                >
                    {% trans "Sign in" %}
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-500 mt-6">
            Django + HTMX — Synchronized Survey
        </p>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
