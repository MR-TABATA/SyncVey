[pytest]
DJANGO_SETTINGS_MODULE = config.settings
# プラグイン（syncvey_cli / syncvey_drift_risk）のテストは Django 流の tests.py。
# これを入れないと、CI の pytest はそれらを 1 件も拾わない（以前は 56 件が黙って漏れていた）。
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*
# Django 5 + pytest-playwright (asyncio) の競合を回避
env =
    DJANGO_ALLOW_ASYNC_UNSAFE=true
# Playwright: 失敗時のみスクリーンショットを test-results/ に保存
addopts = --screenshot=only-on-failure --output=test-results
